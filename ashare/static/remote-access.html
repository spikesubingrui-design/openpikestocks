<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程访问 · OpenPike Stocks</title><link rel="stylesheet" href="/static/remote.css"><script defer src="/static/remote-access.js"></script></head>
<body><header><a class="brand" href="/"><img src="/static/brand/openpike-stocks-logo.png" alt="" width="36" height="36"><strong>OpenPike <span>Stocks</span></strong></a><a href="/">返回看板</a></header>
<main><h1>你的私人远程入口</h1><p class="intro">程序和交易记录留在这台电脑。远程访问需要主机开机，并保持行情服务与转发连接运行。</p>
<section aria-labelledby="address-title"><h2 id="address-title">访问地址</h2><p class="domain">stocks.example.com</p><p id="connection" role="status">正在检查配置…</p><p class="muted">解析记录、专属证书与云端转发全部验收后，才会显示可访问。当前配置不会把主机端口直接开放到公网。</p></section>
<section aria-labelledby="password-title"><h2 id="password-title">远程登录密码</h2><p id="password-state" class="muted">正在读取密码状态…</p><form id="password-form"><label for="password">设置密码（至少12个字符）</label><input id="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required><label for="confirm">再次输入密码</label><input id="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required><button id="submit" type="submit">保存密码</button><output id="result" role="status" aria-live="polite"></output></form><p class="muted">请亲自填写密码，不需要把它发给聊天。修改密码后，其他设备须重新登录。</p></section></main></body></html>
