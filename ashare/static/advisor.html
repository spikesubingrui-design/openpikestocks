<body><a class="skip-link" href="#question">跳到提问</a><header><a class="brand" href="/"><img src="/static/brand/openpike-stocks-logo.png" alt="" width="36" height="36"><strong>OpenPike <span>Stocks</span></strong></a><nav aria-label="顾问导航"><a href="/">返回行情</a><a href="/advisor" aria-current="page">AI 顾问</a><button type="button" id="remote-logout" hidden>退出登录</button></nav></header>
<main class="advisor-layout"><aside class="conversations" aria-label="研究对话"><div class="history-heading"><h2>我的对话</h2><button id="new-chat" type="button">新对话</button></div><div id="history"><p class="muted">正在读取对话…</p></div><p class="history-note muted">对话保存在本机，可随时继续。Mac 需保持开机联网。</p></aside>
<section class="chat-workspace" aria-labelledby="advisor-title"><div class="chat-heading"><div><h1 id="advisor-title">你的私人研究顾问</h1><p class="muted">结合关注股、评分、证据和真实持仓，讨论 3—15 个交易日的机会。</p></div><span id="advisor-status" role="status">正在检查连接…</span></div>
<div id="chat-error" role="alert" hidden></div><div class="transcript" id="transcript" aria-label="问答记录"><div class="welcome"><h2>从一个具体问题开始</h2><p>我会查看软件里的数据，解释哪些条件已满足、哪些仍需等待。</p><div class="starter-questions"><button type="button" data-question="目前有没有通过全部条件的买点？为什么最强候选还不能买？">现在有合格买点吗？</button><button type="button" data-question="对比002083孚日股份和002675东诚药业，列出数据时间、评分差异、公告风险和买卖条件。">对比孚日与东诚</button><button type="button" data-question="根据我的实际持仓，有没有需要优先处理的退出条件？">检查我的持仓</button></div></div></div>
<div id="proposals" aria-label="待确认修改"></div><form id="question-form"><label for="question" class="question-label">向 Codex 提问</label><textarea id="question" maxlength="5000" rows="3" required placeholder="输入股票代码、研究问题，或提出修改…"></textarea><div class="composer-actions"><span class="muted">Enter 发送 · Shift+Enter 换行</span><div><button id="retry-question" type="button" hidden>核验并重试原提问</button><button id="stop-answer" type="button" hidden>停止回答</button><button id="send-question" type="submit">发送</button></div></div><output id="send-result" role="status"></output></form><p class="advisor-foot muted">修改先显示草稿，由你确认保存。评分不等于胜率；策略想法沿用验证门槛，不产生证券委托。</p></section></main></body></html>
